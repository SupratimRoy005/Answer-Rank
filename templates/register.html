{% extends "base.html" %}{% block title %}Create account · AnswerRank{% endblock %}{% block content %}<section class="card formcard"><h1>Create your account</h1><p class="muted">Choose Teacher if you will create classes, or Student to join a class.</p><form method="post"><label>Full name</label><input name="name" maxlength="100" required value="{{ request.form.get('name','') }}"><label>Email</label><input type="email" name="email" maxlength="160" required value="{{ request.form.get('email','') }}"><label>Password (minimum 8 characters)</label><input type="password" name="password" minlength="8" required><label>Account type</label><select name="role"><option value="student">Student</option><option value="teacher" {% if request.form.get('role')=='teacher' %}selected{% endif %}>Teacher</option></select><button class="full" type="submit">Create account</button></form><p>Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
